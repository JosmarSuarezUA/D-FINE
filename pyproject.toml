[project]
name = "d-fine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "calflops>=0.3.2",
    "faster-coco-eval>=1.6.6",
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "onnxruntime>=1.30.0",
    "openvino>=2026.4.0",
    "pycocotools>=2.0.11",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "tensorboard>=2.21.0",
    "tensorrt>=11.3.0.99",
    "torch>=2.0.1",
    "torchvision>=0.15.2",
    "transformers>=5.17.0",
    "wandb>=0.30.0",
]

[project.scripts]
d-fine = "d_fine:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
